# 팀 서버(EC2) 배포용. 로컬 개발용은 backend/docker-compose.yml 이다.
# 비밀값은 같은 폴더의 .env 에서 읽는다 (deploy.sh 가 서버의 /opt/ktc4/shared/.env 를 복사해 둔다).
name: ktc4

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # backend 가 ../ai 패키지를 쓰므로 레포 루트를 컨텍스트로 빌드한다
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ../ai/output/erd:/data/erd:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # 비어 있으면 :80 (HTTP 전용). 빈 문자열로 넘기면 Caddy 기본값이 안 먹어서 여기서 채운다.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../frontend/build/web:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서 보관. 지우면 재발급되는데 Let's Encrypt 발급 횟수 제한에 걸릴 수 있다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
